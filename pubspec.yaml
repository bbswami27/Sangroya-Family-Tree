name: sangroya_family_tree
description: SANGROYA FAMILY TREE Android prototype
publish_to: "none"
version: 0.1.1+3
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  excel: ^4.0.6
  shared_preferences: ^2.3.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/sangroya_launcher_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/sangroya_launcher_icon.png
  adaptive_icon_background: "#0B4A22"
  adaptive_icon_foreground: assets/branding/sangroya_launcher_icon.png
  min_sdk_android: 21
