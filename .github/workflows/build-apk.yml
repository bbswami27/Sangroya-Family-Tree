name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Generate only missing Android platform scaffolding.
      # Do NOT use --overwrite: it replaces lib/main.dart with Flutter's counter demo.
      - name: Generate Android platform files
        run: flutter create --project-name sangroya_family_tree --platforms android --org com.sangroya.familytree .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Sangroya-Family-Tree-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
