name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Accept Android SDK licenses and install API 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Android platform files
        run: flutter create --project-name sangroya_family_tree --platforms android --org com.sangroya.familytree .
      - name: Prepare signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "Missing GitHub Actions secret: $name"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/sangroya-upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=sangroya-upload-keystore.jks
          EOF
      - name: Configure Android release signing and compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          imports = "import java.util.Properties\nimport java.io.FileInputStream\n"
          if "import java.util.Properties" not in s:
              s = imports + s
          load = '''
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
          if "val keystoreProperties = Properties()" not in s:
              s = s.replace("android {", load + "android {", 1)
          signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
          if 'create("release")' not in s:
              s = s.replace("    defaultConfig {", signing + "\n    defaultConfig {", 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace("        release {", '        release {\n            signingConfig = signingConfigs.getByName("release")', 1)
          if "compileSdk = 36" not in s or 'signingConfig = signingConfigs.getByName("release")' not in s:
              raise SystemExit("Android release signing/compileSdk configuration failed")
          p.write_text(s)
          print("Configured release signing and compileSdk 36")
          PY
      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Force Android plugin modules to compile with API 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache"))) / "hosted" / "pub.dev"
          p = root / "file_picker-8.3.7" / "android" / "build.gradle"
          if not p.exists():
              raise SystemExit(f"Required plugin Gradle file not found: {p}")
          s = p.read_text()
          updated = s.replace("compileSdk 34", "compileSdk 36").replace("compileSdkVersion 34", "compileSdkVersion 36").replace("flutter.compileSdkVersion", "36")
          if "compileSdk 34" in updated or "compileSdkVersion 34" in updated:
              raise SystemExit(f"API 34 compileSdk remains in {p}")
          p.write_text(updated)
          PY
      - run: flutter analyze lib
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Sangroya-Family-Tree-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
